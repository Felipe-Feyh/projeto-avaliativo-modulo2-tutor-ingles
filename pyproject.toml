[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mentoria"
version = "0.1.0"
description = "MentorIA - agente tutor de ingles (LangGraph) para flashcards por tema e compreensao de leitura"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felipe Feyh" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langchain-google-genai>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mentoria"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Prompts contem strings longas (schemas JSON) que nao devem ser quebradas.
"src/mentoria/prompts.py" = ["E501"]
# Testes contem payloads JSON de exemplo e strings longas em linha unica.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
